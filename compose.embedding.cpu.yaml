# CPU TEI override (§3.10.3). Mutually exclusive with compose.embedding.gpu.yaml.
services:
  embedding-service:
    image: ${TEI_CPU_IMAGE}
    environment:
      AUTO_TRUNCATE: "false"
      HTTP_PROXY: ${PROXY__HTTP_URL}
      HTTPS_PROXY: ${PROXY__HTTP_URL}
      NO_PROXY: "localhost,127.0.0.1,redis,mongodb,kafka,neo4j,elasticsearch,embedding-service,memory-api,memory-extraction-worker,memory-consolidation-worker"
    command:
      - --model-id
      - ${EMBEDDING_MODEL_ID}
      - --revision
      - ${EMBEDDING_MODEL_REVISION}
      - --served-model-name
      - ${EMBEDDING_MODEL_ID}
      - --dtype
      - float32
      - --max-client-batch-size
      - "64"
      - --max-batch-tokens
      - "8192"
      - --max-batch-requests
      - "4"
      - --max-concurrent-requests
      - "8"
      - --json-output
    volumes:
      - embedding-model-cache:/data
    mem_limit: 12g
    cpus: 4.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - memory-system-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 120s
