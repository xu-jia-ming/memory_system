name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --locked
      - run: uv run ruff check src tests scripts
      - run: uv run mypy src
      - run: uv run python scripts/check_env_example.py

  unit-contract-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --locked
      - run: cp .env.example .env
      - run: |
          uv run pytest tests/unit tests/contract \
            -m "not runtime_contract_gate and not task_scope_boundary" \
            --cov=memory_system.domain \
            --cov=memory_system.application \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            -q

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --locked
      - run: cp .env.example .env
      - run: |
          uv run pytest tests/integration \
            -m "not runtime_contract_gate" \
            -q
